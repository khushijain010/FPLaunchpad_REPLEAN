name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All samples compile
        run: pnpm verify
      - name: Committed traces match a fresh Lean run
        run: pnpm golden

  live-server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the public live-mode image
        run: docker build -t lemmascope-live .
      - name: Smoke test it against real Lean
        run: |
          docker run -d --name live -p 8787:8787 -e LEMMASCOPE_ORIGINS=https://example.github.io lemmascope-live
          for i in $(seq 1 60); do curl -sf localhost:8787/api/health && break; sleep 2; done
          curl -sf localhost:8787/api/health | grep '"ok":true'
          # A real proof comes back as a trace with three steps.
          curl -sf -X POST localhost:8787/api/trace -H 'content-type: application/json'             -d '{"source":"theorem t (p q : Prop) (hp : p) (hq : q) : p ∧ q := by
  constructor
  · exact hp
  · exact hq
"}'             | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const n=JSON.parse(d).trace.steps.length;console.log("steps",n);process.exit(n===3?0:1)})'
          # Code execution is refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/api/trace -H 'content-type: application/json' -d '{"source":"#eval 1"}')" = 422
          # Other websites are refused.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8787/api/trace -H 'origin: https://evil.example' -H 'content-type: application/json' -d '{"source":"x"}')" = 403
      - if: failure()
        run: docker logs live || true
